<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>من سيربح الدينار و99 قرش</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Cairo", sans-serif;
        background: radial-gradient(circle at center, #0a1f5c 0%, #020617 100%);
        color: #fff;
        user-select: none;
      }
      .hidden { display: none !important; }

      /* شاشة البداية */
      #welcome-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 2rem 1rem 3rem;
        background: url("images/welcome-background-img.jpg") center/cover no-repeat;
      }
      @media (max-width: 640px) {
        #welcome-screen { background-image: url("images/welcome-background-mobile.jpg"); }
      }
      .title-box {
        background: linear-gradient(180deg, #061338, #0d2b7a, #061338);
        border: 3px solid #60a5fa;
        border-radius: 16px;
        padding: 1rem 2rem;
        text-align: center;
        margin-bottom: 1.2rem;
        box-shadow: 0 10px 30px rgba(0,0,0,0.85);
        max-width: 620px;
        width: 92%;
      }
      .title-box .subtitle { color: #f59e0b; font-size: 1rem; font-weight: 800; }
      .title-box h1 { font-size: clamp(1.5rem, 4vw, 2.4rem); font-weight: 900; }

      #lets-play {
        cursor: pointer;
        position: relative;
        z-index: 50;
        background: linear-gradient(180deg, #061338, #103494, #061338);
        border: 3px solid #60a5fa;
        border-radius: 14px;
        padding: 0.9rem 2rem;
        color: #fff;
        font-family: "Cairo", sans-serif;
        font-size: 1.4rem;
        font-weight: 900;
        width: 92%;
        max-width: 400px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.85);
      }
      #lets-play:hover, #lets-play:active {
        background: linear-gradient(180deg, #fbbf24, #d97706);
        color: #000;
        border-color: #fef08a;
      }

      /* شاشة اللعب */
      #game-screen {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 1.2rem 1rem 1.8rem;
        background: url("images/game-background.jpg") center/cover no-repeat;
      }
      .top-bar {
        width: 100%;
        max-width: 1050px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .lifelines-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.7rem;
        background: rgba(5, 15, 45, 0.85);
        padding: 0.75rem;
        border-radius: 16px;
        border: 2px solid #3b82f6;
      }
      @media (max-width: 640px) {
        .lifelines-panel { flex-direction: row; width: 100%; justify-content: space-around; }
      }
      .lifeline-btn {
        background: #0d2b7a;
        border: 2px solid #60a5fa;
        border-radius: 50%;
        width: 66px;
        height: 66px;
        color: #fff;
        font-family: "Cairo", sans-serif;
        font-weight: 900;
        font-size: 0.85rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .lifeline-btn img { width: 100%; height: 100%; object-fit: contain; }
      .lifeline-used { opacity: 0.28; pointer-events: none; filter: grayscale(100%); }
      .audio-control { background: none; border: none; color: #fff; font-size: 1.9rem; cursor: pointer; }

      /* سلم الجوائز */
      .ladder-card {
        background: rgba(6, 18, 54, 0.92);
        border: 3px solid #cbd5e1;
        border-radius: 14px;
        padding: 0.6rem 1.2rem;
        min-width: 230px;
      }
      @media (max-width: 640px) { .ladder-card { width: 100%; } }
      #money-ladder { list-style: none; font-size: 0.95rem; font-weight: 700; color: #f59e0b; }
      #money-ladder li {
        padding: 0.15rem 0.6rem;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
      }
      #money-ladder li.milestone { color: #fff; font-weight: 900; }
      #money-ladder li.money-active {
        background: linear-gradient(90deg, #d97706, #fbbf24, #d97706);
        color: #000 !important;
        font-weight: 900;
      }

      /* الأسئلة والخيارات */
      .quiz-area { width: 100%; max-width: 1000px; margin-top: 1rem; }
      .prize-badge-wrap { text-align: center; margin-bottom: 0.6rem; }
      #current-prize-badge {
        display: inline-block;
        background: rgba(6, 18, 54, 0.95);
        border: 2px solid #f59e0b;
        color: #fbbf24;
        font-weight: 800;
        padding: 0.3rem 1.2rem;
        border-radius: 999px;
      }
      #question-card {
        background: linear-gradient(180deg, #061338, #0e2e82, #061338);
        border: 3px solid #60a5fa;
        border-radius: 16px;
        padding: 1.2rem 1.5rem;
        text-align: center;
        margin-bottom: 1rem;
      }
      #question-card h2 { font-size: clamp(1.15rem, 2.5vw, 1.6rem); font-weight: 800; }
      #options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; }
      @media (max-width: 640px) { #options-grid { grid-template-columns: 1fr; } }

      .options {
        background: linear-gradient(180deg, #061338, #0d2b7a, #061338);
        border: 3px solid #60a5fa;
        border-radius: 14px;
        padding: 0.85rem 1.2rem;
        font-size: 1.15rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
      }
      .options:hover { background: linear-gradient(180deg, #fbbf24, #d97706); color: #000; border-color: #fef08a; }
      .options:hover .opt-letter { color: #000; }
      .opt-letter { color: #f59e0b; font-weight: 900; margin-left: 0.6rem; }

      .selected-answer { background: linear-gradient(180deg, #fbbf24, #b45309) !important; color: #000 !important; border-color: #fef08a !important; }
      .selected-answer .opt-letter { color: #000 !important; }
      .correct-answer { background: linear-gradient(180deg, #22c55e, #15803d) !important; color: #fff !important; border-color: #bbf7d0 !important; }
      .correct-answer .opt-letter { color: #fff !important; }
      .wrong-answer { background: linear-gradient(180deg, #ef4444, #991b1b) !important; color: #fff !important; border-color: #fecaca !important; }
      .disabled-option { opacity: 0.18; pointer-events: none; }
      .locked-grid { pointer-events: none; }

      /* النوافذ المنبثقة */
      .modal-overlay {
        position: fixed; inset: 0; z-index: 999;
        background: rgba(0,0,0,0.85);
        display: flex; align-items: center; justify-content: center; padding: 1rem;
      }
      .modal-box {
        background: linear-gradient(180deg, #061338, #0e2a75);
        border: 4px solid #f59e0b;
        border-radius: 20px;
        padding: 2rem 1.5rem;
        max-width: 460px;
        width: 100%;
        text-align: center;
      }
      .modal-btn {
        cursor: pointer; margin-top: 1.2rem;
        background: linear-gradient(180deg, #061338, #103494);
        border: 2px solid #f59e0b; border-radius: 12px;
        padding: 0.65rem 2rem; color: #fff;
        font-family: "Cairo", sans-serif; font-size: 1.1rem; font-weight: 800;
      }
      .modal-btn:hover { background: #f59e0b; color: #000; }
      .audience-row { margin-bottom: 0.75rem; text-align: right; }
      .audience-label { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 0.2rem; }
      .audience-bar-bg { width: 100%; height: 14px; background: #020617; border-radius: 999px; border: 1px solid #60a5fa; overflow: hidden; }
      .audience-bar-fill { height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24); }
    </style>
  </head>
  <body>
    <audio id="first-ping" src="audio/first-ping.mp3"></audio>
    <audio id="second-ping" src="audio/second-ping.mp3"></audio>
    <audio id="third-ping" src="audio/third-ping.mp3"></audio>
    <audio loop id="lets-play-audio" src="audio/lets-play.mp3"></audio>
    <audio id="selected-answer-audio" src="audio/selected-answer.mp3"></audio>
    <audio id="correct-answer-audio" src="audio/correct-answer.mp3"></audio>
    <audio id="wrong-answer-audio" src="audio/wrong-answer-audio.mp3"></audio>

    <!-- شاشة البداية -->
    <section id="welcome-screen">
      <div class="title-box">
        <p class="subtitle">النسخة الخاصة</p>
        <h1>من سيربح الدينار و99 قرش؟</h1>
      </div>
      <button id="lets-play" type="button" onclick="window.startGame()">ابدأ اللعب</button>
    </section>

    <!-- شاشة اللعب -->
    <section id="game-screen" class="hidden">
      <div class="top-bar">
        <div class="lifelines-panel">
          <button id="fifty-fifty" class="lifeline-btn" type="button" onclick="window.useFiftyFifty()">
            <img src="images/50-50.png" alt="50:50" onerror="this.parentElement.textContent='50:50'" />
          </button>
          <button id="phone-a-friend" class="lifeline-btn" type="button" onclick="window.usePhoneFriend()">
            <img src="images/phone-a-friend.png" alt="اتصال" onerror="this.parentElement.textContent='اتصال'" />
          </button>
          <button id="ask-the-audience" class="lifeline-btn" type="button" onclick="window.useAskAudience()">
            <img src="images/ask-the-audience.png" alt="الجمهور" onerror="this.parentElement.textContent='الجمهور'" />
          </button>
          <button id="audio-toggle" class="audio-control" type="button" onclick="window.toggleAudio()">
            <i id="icon-unmute" class="fas fa-volume-up hidden"></i>
            <i id="icon-mute" class="fas fa-volume-mute"></i>
          </button>
        </div>

        <div class="ladder-card">
          <ul id="money-ladder">
            <li data-level="9" class="milestone"><span>10</span><span>1.99 دينار</span></li>
            <li data-level="8"><span>9</span><span>دينار ونص</span></li>
            <li data-level="7"><span>8</span><span>دينار واحد</span></li>
            <li data-level="6" class="milestone"><span>7</span><span>نص دينار</span></li>
            <li data-level="5"><span>6</span><span>ربع دينار</span></li>
            <li data-level="4"><span>5</span><span>20 قرش</span></li>
            <li data-level="3" class="milestone"><span>4</span><span>10 قروش</span></li>
            <li data-level="2"><span>3</span><span>5 قروش</span></li>
            <li data-level="1"><span>2</span><span>3 قروش</span></li>
            <li data-level="0" class="money-active"><span>1</span><span>1 قرش</span></li>
          </ul>
        </div>
      </div>

      <div class="quiz-area">
        <div class="prize-badge-wrap">
          <span id="current-prize-badge">السؤال 1 من 10 • قيمة الجائزة: 1 قرش</span>
        </div>
        <div id="question-card"><h2 id="question-text">...</h2></div>
        <div id="options-grid">
          <div data-id="0" class="options" onclick="window.handleOptionClick(0)"><span class="opt-letter">أ:</span><span class="opt-text"></span></div>
          <div data-id="1" class="options" onclick="window.handleOptionClick(1)"><span class="opt-letter">ب:</span><span class="opt-text"></span></div>
          <div data-id="2" class="options" onclick="window.handleOptionClick(2)"><span class="opt-letter">ج:</span><span class="opt-text"></span></div>
          <div data-id="3" class="options" onclick="window.handleOptionClick(3)"><span class="opt-letter">د:</span><span class="opt-text"></span></div>
        </div>
      </div>
    </section>

    <!-- نافذة وسائل المساعدة -->
    <div id="lifeline-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="lifeline-title" style="color:#fbbf24; font-size:1.6rem; font-weight:900; margin-bottom:1rem;"></h3>
        <div id="lifeline-body" style="font-size:1.1rem;"></div>
        <button class="modal-btn" type="button" onclick="window.closeLifelineModal()">إغلاق</button>
      </div>
    </div>

    <!-- نافذة النتيجة النهائية -->
    <div id="endgame-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <p id="endgame-subtitle" style="color:#fbbf24; font-weight:800; font-size:1.15rem; margin-bottom:0.4rem;"></p>
        <h2 id="endgame-title" style="font-size:1.9rem; font-weight:900; margin-bottom:1rem;"></h2>
        <div style="background:#020617; border:2px solid #94a3b8; border-radius:14px; padding:1rem;">
          <p style="color:#cbd5e1; font-size:0.95rem;">رصيدك النهائي</p>
          <p id="endgame-prize" style="color:#fbbf24; font-size:2.2rem; font-weight:900;"></p>
        </div>
        <button class="modal-btn" type="button" onclick="window.restartGame()">العب مرة ثانية</button>
      </div>
    </div>

    <script>
      const PRIZE_LADDER = [
        "1 قرش", "3 قروش", "5 قروش", "10 قروش", "20 قرش",
        "ربع دينار", "نص دينار", "دينار واحد", "دينار ونص", "1.99 دينار"
      ];

      const QUESTIONS = [
        { question: "ما هو لون الحليب الطبيعي؟", content: ["أبيض", "أزرق سماوي", "فسفوري", "شفاف"], correct: 0 },
        { question: "إذا أكلت شاورما بدون مثومة، فماذا يُعتبر هذا الفعل في العُرف الأردني؟", content: ["خيانة عظمى للسندويشة", "نظام صحي متكامل", "توفير استراتيجي", "وصفة فرنسية"], correct: 0 },
        { question: "كم تساوي مدة «خمس دقائق وبكون عندك» عند الشباب؟", content: ["5 دقائق بالضبط", "نصف ساعة إلى ما لا نهاية", "30 ثانية", "دقيقتين ونص"], correct: 1 },
        { question: "ما هي المدينة الأردنية التي تُلقّب بـ «عروس الشمال»؟", content: ["السلط", "إربد", "الكرك", "معان"], correct: 1 },
        { question: "أي من هذه العبارات تعني باللهجة الأردنية «اترك الموضوع عليّ ولا تهكل هم»؟", content: ["أبشر بعزّك", "يعطيك العافية", "صحّتين وهنا", "مساء الخير"], correct: 0 },
        { question: "ما هو المكوّن الأساسي الذي يُصنع منه الجميد الكركي الأصيل؟", content: ["حليب الغنم أو الماعز", "حليب جوز الهند", "طحين القمح", "زيت الزيتون"], correct: 0 },
        { question: "كم يبلغ مجموع قياس زوايا المثلث الداخلية؟", content: ["90 درجة", "180 درجة", "270 درجة", "360 درجة"], correct: 1 },
        { question: "ما هو الكوكب الذي يُعرف في مجموعتنا الشمسية باسم «الكوكب الأحمر»؟", content: ["المشتري", "الزهرة", "المريخ", "زحل"], correct: 2 },
        { question: "ما هي أطول سورة في القرآن الكريم؟", content: ["سورة آل عمران", "سورة النساء", "سورة البقرة", "سورة الأعراف"], correct: 2 },
        { question: "إذا ربحت اليوم دينار و99 قرش، كم يتبقى لك لتُكمل الدينارين؟", content: ["قرش واحد فقط", "نصف دينار", "عشرة قروش", "ربع دينار"], correct: 0 }
      ];

      let currentIndex = 0;
      let isAudioOn = true;
      let phoneTimer = null;

      function playSound(id, reset = true) {
        if (!isAudioOn) return;
        const el = document.getElementById(id);
        if (!el) return;
        if (reset) el.currentTime = 0;
        el.play().catch(() => {});
      }

      function stopSound(id) {
        const el = document.getElementById(id);
        if (el) el.pause();
      }

      const delay = (ms) => new Promise((r) => setTimeout(r, ms));

      function updateLadder(idx) {
        document.querySelectorAll("#money-ladder li").forEach((li) => {
          li.classList.toggle("money-active", Number(li.dataset.level) === idx);
        });
        document.getElementById("current-prize-badge").textContent =
          "السؤال " + (idx + 1) + " من 10 • قيمة الجائزة: " + PRIZE_LADDER[idx];
      }

      function loadQuestion(idx) {
        const grid = document.getElementById("options-grid");
        grid.classList.remove("locked-grid");
        const opts = document.querySelectorAll(".options");
        opts.forEach((el) => el.classList.remove("selected-answer", "correct-answer", "wrong-answer", "disabled-option"));

        playSound("lets-play-audio", false);
        updateLadder(idx);

        const q = QUESTIONS[idx];
        document.getElementById("question-text").textContent = q.question;
        opts.forEach((el, i) => {
          el.querySelector(".opt-text").textContent = q.content[i];
        });
      }

      window.startGame = function () {
        document.getElementById("welcome-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        currentIndex = 0;
        loadQuestion(0);
      };

      function getGuaranteedPrize(idx) {
        if (idx >= 7) return "نص دينار";
        if (idx >= 4) return "10 قروش";
        return "0 قرش";
      }

      function showEndGame(isWinner, prize) {
        stopSound("lets-play-audio");
        const title = document.getElementById("endgame-title");
        const sub = document.getElementById("endgame-subtitle");
        if (isWinner) {
          sub.textContent = "مبروك الفوز الساحق!";
          title.textContent = "لقد ربحت الدينار و99 قرش!";
          title.style.color = "#4ade80";
        } else {
          sub.textContent = "حظ أوفر في المرة القادمة";
          title.textContent = "إجابة خاطئة! انتهت اللعبة";
          title.style.color = "#f87171";
        }
        document.getElementById("endgame-prize").textContent = prize;
        document.getElementById("endgame-modal").classList.remove("hidden");
      }

      window.handleOptionClick = async function (chosenIdx) {
        const correctIdx = QUESTIONS[currentIndex].correct;
        const opts = document.querySelectorAll(".options");

        document.getElementById("options-grid").classList.add("locked-grid");
        stopSound("lets-play-audio");
        playSound("selected-answer-audio", true);
        opts[chosenIdx].classList.add("selected-answer");

        await delay(2500);

        if (chosenIdx !== correctIdx) {
          opts[chosenIdx].classList.replace("selected-answer", "wrong-answer");
          opts[correctIdx].classList.add("correct-answer");
          stopSound("selected-answer-audio");
          playSound("wrong-answer-audio", true);
          await delay(2500);
          showEndGame(false, getGuaranteedPrize(currentIndex));
        } else {
          opts[chosenIdx].classList.replace("selected-answer", "correct-answer");
          stopSound("selected-answer-audio");
          playSound("correct-answer-audio", true);
          await delay(3000);

          if (currentIndex >= QUESTIONS.length - 1) {
            showEndGame(true, "1.99 دينار");
          } else {
            currentIndex++;
            loadQuestion(currentIndex);
          }
        }
      };

      window.useFiftyFifty = function () {
        const btn = document.getElementById("fifty-fifty");
        if (btn.classList.contains("lifeline-used")) return;
        btn.classList.add("lifeline-used");
        playSound("first-ping", true);

        const correctIdx = QUESTIONS[currentIndex].correct;
        const wrong = [0, 1, 2, 3].filter((i) => i !== correctIdx).sort(() => Math.random() - 0.5);
        const opts = document.querySelectorAll(".options");
        wrong.slice(0, 2).forEach((i) => opts[i].classList.add("disabled-option"));
      };

      window.usePhoneFriend = function () {
        const btn = document.getElementById("phone-a-friend");
        if (btn.classList.contains("lifeline-used")) return;
        btn.classList.add("lifeline-used");
        playSound("second-ping", true);

        let sec = 30;
        document.getElementById("lifeline-title").textContent = "اتصال بصديق";
        document.getElementById("lifeline-body").innerHTML =
          '<p style="margin-bottom:0.75rem;">جاري الاتصال بصديقك... معك 30 ثانية!</p>' +
          '<div id="phone-timer" style="font-size:3rem; font-weight:900; color:#fbbf24;">' + sec + '</div>';
        document.getElementById("lifeline-modal").classList.remove("hidden");

        clearInterval(phoneTimer);
        phoneTimer = setInterval(() => {
          sec--;
          const t = document.getElementById("phone-timer");
          if (t) t.textContent = sec > 0 ? sec : "انتهى الوقت!";
          if (sec <= 0) clearInterval(phoneTimer);
        }, 1000);
      };

      window.useAskAudience = function () {
        const btn = document.getElementById("ask-the-audience");
        if (btn.classList.contains("lifeline-used")) return;
        btn.classList.add("lifeline-used");
        playSound("third-ping", true);

        const correctIdx = QUESTIONS[currentIndex].correct;
        const percents = [9, 8, 11, 7];
        percents[correctIdx] = 74;
        const letters = ["أ", "ب", "ج", "د"];

        document.getElementById("lifeline-title").textContent = "نتيجة تصويت الجمهور";
        document.getElementById("lifeline-body").innerHTML = letters.map((l, i) =>
          '<div class="audience-row">' +
            '<div class="audience-label"><span>الخيار (' + l + ')</span><span style="color:#fbbf24;">' + percents[i] + '%</span></div>' +
            '<div class="audience-bar-bg"><div class="audience-bar-fill" style="width:' + percents[i] + '%"></div></div>' +
          '</div>'
        ).join("");
        document.getElementById("lifeline-modal").classList.remove("hidden");
      };

      window.closeLifelineModal = function () {
        clearInterval(phoneTimer);
        document.getElementById("lifeline-modal").classList.add("hidden");
      };

      window.restartGame = function () {
        document.getElementById("endgame-modal").classList.add("hidden");
        ["fifty-fifty", "phone-a-friend", "ask-the-audience"].forEach((id) => {
          document.getElementById(id).classList.remove("lifeline-used");
        });
        currentIndex = 0;
        loadQuestion(0);
      };

      window.toggleAudio = function () {
        isAudioOn = !isAudioOn;
        document.getElementById("icon-unmute").classList.toggle("hidden", isAudioOn);
        document.getElementById("icon-mute").classList.toggle("hidden", !isAudioOn);
        if (isAudioOn) playSound("lets-play-audio", false);
        else stopSound("lets-play-audio");
      };
    </script>
  </body>
</html>
